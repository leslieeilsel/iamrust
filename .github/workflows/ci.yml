name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libx11-xcb-dev
          libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          libvulkan-dev patchelf
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo build --workspace --locked
      - uses: EmbarkStudios/cargo-deny-action@v2

  database-recovery:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify fresh migration, previous-version upgrade, backup and restore
        env:
          IAMRUST_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: ./scripts/test-migrations.sh

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4

  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxkbcommon-x11-dev
          libfontconfig1-dev libwayland-dev libx11-xcb-dev libxcb1-dev
          libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev
      - run: cargo build --release --locked -p iamrust-desktop
