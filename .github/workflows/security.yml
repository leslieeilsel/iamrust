name: Security

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - uses: EmbarkStudios/cargo-deny-action@v2

  protocol-fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run protocol_frames -- -max_total_time=20
      - run: cargo fuzz run upload_metadata -- -max_total_time=20
