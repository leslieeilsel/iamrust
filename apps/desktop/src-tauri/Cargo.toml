[package]
name = "iamrust-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "iamrust_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "i-am-rust"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
aes-gcm.workspace = true
data-encoding.workspace = true
iamrust-client-core = { path = "../../../crates/client-core" }
iamrust-domain = { path = "../../../crates/domain" }
iamrust-protocol = { path = "../../../crates/protocol" }
keyring.workspace = true
rand.workspace = true
chrono.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2.9.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2.4.1"
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[build-dependencies]
tauri-build = "2.5.1"

[dev-dependencies]
iamrust-test-support = { path = "../../../crates/test-support" }
tempfile = "3.27.0"

[lints]
workspace = true
