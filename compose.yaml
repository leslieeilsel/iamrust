name: iamrust

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: iamrust
      POSTGRES_USER: iamrust
      POSTGRES_PASSWORD: ${IAMRUST_POSTGRES_PASSWORD:-iamrust-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iamrust -d iamrust"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${IAMRUST_S3_ACCESS_KEY:-iamrust}
      MINIO_ROOT_PASSWORD: ${IAMRUST_S3_SECRET_KEY:-iamrust-dev-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${IAMRUST_S3_ACCESS_KEY:-iamrust}
      MINIO_ROOT_PASSWORD: ${IAMRUST_S3_SECRET_KEY:-iamrust-dev-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/iamrust-media &&
        mc anonymous set none local/iamrust-media
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    restart: unless-stopped

  server:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      IAMRUST_BIND_ADDR: 0.0.0.0:3780
      IAMRUST_DATABASE_URL: postgres://iamrust:${IAMRUST_POSTGRES_PASSWORD:-iamrust-dev-only}@postgres:5432/iamrust
      IAMRUST_JWT_SECRET: ${IAMRUST_JWT_SECRET:-development-secret-change-me-32-bytes}
      IAMRUST_DATA_ENCRYPTION_KEY: ${IAMRUST_DATA_ENCRYPTION_KEY:-development-data-key-change-me-32-bytes}
      IAMRUST_S3_ENDPOINT: http://minio:9000
      IAMRUST_S3_REGION: us-east-1
      IAMRUST_S3_BUCKET: iamrust-media
      IAMRUST_S3_ACCESS_KEY: ${IAMRUST_S3_ACCESS_KEY:-iamrust}
      IAMRUST_S3_SECRET_KEY: ${IAMRUST_S3_SECRET_KEY:-iamrust-dev-secret}
      IAMRUST_SMTP_URL: smtp://mailpit:1025
      IAMRUST_EMAIL_FROM: I Am Rust <noreply@iamrust.local>
      IAMRUST_LOG: info
      IAMRUST_OTLP_ENDPOINT: ${IAMRUST_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose: ["3780"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3780/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  caddy:
    profiles: ["full"]
    image: caddy:2.10-alpine
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
